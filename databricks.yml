# Databricks Asset Bundle Configuration for AWS
bundle:
  name: databricks_pipeline

workspace:
  host: https://dbc-831b8c43-0006.cloud.databricks.com
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

include:
  - resources/*.yml

targets:
  # Development environment
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-831b8c43-0006.cloud.databricks.com
    variables:
      environment: dev
      catalog: scdtypes
      schema: scd_realtime
      aws_region: us-east-1
      warehouse_id: d3dd36c2ec031441
    run_as:
      user_name: ${workspace.current_user.userName}
  
  # Staging environment
  staging:
    mode: production
    workspace:
      host: https://dbc-831b8c43-0006.cloud.databricks.com
    variables:
      environment: staging
      catalog: staging_catalog
      schema: scd_realtime
      aws_region: us-east-1
      warehouse_id: d3dd36c2ec031441
    run_as:
      service_principal_name: ${var.staging_sp_id}
  
  # Production environment
  prod:
    mode: production
    workspace:
      host: https://dbc-831b8c43-0006.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/prod
    variables:
      environment: prod
      catalog: prod_catalog
      schema: scd_realtime
      aws_region: us-east-1
      warehouse_id: d3dd36c2ec031441
    permissions:
      - level: CAN_MANAGE
        group_name: data-engineers
      - level: CAN_VIEW
        group_name: data-analysts
    run_as:
      service_principal_name: ${var.prod_sp_id}

variables:
  environment:
    description: "Deployment environment"
    default: dev
  catalog:
    description: "Unity Catalog name"
    default: main
  schema:
    description: "Schema name"
    default: default
  aws_region:
    description: "AWS Region"
    default: us-east-1
  staging_sp_id:
    description: "Service Principal ID for staging"
    default: ""
  prod_sp_id:
    description: "Service Principal ID for production"
    default: ""
  warehouse_id:
    description: "SQL Warehouse ID for SQL tasks"
    default: d3dd36c2ec031441

# Sync configurations
sync:
  exclude:
    - ".git"
    - ".gitignore"
    - "__pycache__"
    - "*.pyc"
    - ".databricks"
    - "*.egg-info"
